# ~/.config/devc/config.toml – alle Werte sind Defaults (SPEC 6.1)
platform = "auto"
allowed_roots = []

[server]
bind = "127.0.0.1"
port = 8740
allowed_hosts = ["localhost", "127.0.0.1"]
terminal = true
tls_cert = ""
tls_key = ""
base_domain = ""
public_port = 443
behind_proxy = false

[defaults]
image = "ubuntu:24.04"
cpu = 4
memory = "8GiB"
disk = "30GiB"
addons = ["claude-code"]

[lxd]
project = "devcontainers"
storage_pool = "default"
network = "lxdbr0"
shared_mode = "idmap"

[paths]
addons = "~/.config/devc/addons"
templates = "~/.config/devc/templates"
secrets = "~/.config/devc/secrets"
state = "~/.local/share/devc"
backups = "~/.local/share/devc/backups"
